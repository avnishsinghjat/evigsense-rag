project_id = "local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.rag-assistant]
verify_jwt = true

[functions.generate-embeddings]
verify_jwt = false

[functions.extract-document-text]
verify_jwt = false

[functions.process-queue]
verify_jwt = false

[functions.paddle-ocr]
verify_jwt = true

[functions.transcribe-audio]
verify_jwt = false

[functions.convert-scanned-pdf]
verify_jwt = false
